<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallel Hearts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050816;color:#f0e6d2;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#c8a855;color:#050816}

/* ── Landing ── */
#landing{position:fixed;inset:0;z-index:50;background:#050816;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 2.5s cubic-bezier(.16,1,.3,1)}
#landing.out{opacity:0;pointer-events:none}
#landCanvas{position:absolute;inset:0;width:100%;height:100%}
#titleBlock{text-align:center;position:relative;z-index:2;opacity:0;transition:opacity 3s cubic-bezier(.16,1,.3,1)}
#titleBlock h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(40px,8vw,84px);font-weight:300;letter-spacing:.04em;line-height:1.05;color:#f0e6d2}
#titleBlock h1 em{font-style:italic;color:#c8a855}
#titleBlock .tagline{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(13px,1.8vw,18px);font-weight:300;color:rgba(200,168,85,.7);margin-top:16px;letter-spacing:.08em;font-style:italic}
#enterBtn{margin-top:40px;padding:13px 36px;border:1.5px solid rgba(200,168,85,.3);border-radius:28px;background:transparent;color:#c8a855;font-family:'Inter',sans-serif;font-size:11px;font-weight:300;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;opacity:0;transition:all .5s cubic-bezier(.16,1,.3,1);position:relative;z-index:2}
#enterBtn:hover{background:rgba(200,168,85,.08);border-color:rgba(200,168,85,.5);transform:scale(1.04);box-shadow:0 0 30px rgba(200,168,85,.1)}
#enterBtn.show{animation:btnPulse 3s ease-in-out infinite}
@keyframes btnPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── Main View ── */
#mainCanvas{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 3s}
#mainCanvas.on{opacity:1}
#skyCanvas{position:fixed;inset:0;z-index:0}

/* ── HUD — clean layout, no collisions ── */
#hud{position:fixed;top:0;left:0;right:0;z-index:12;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:24px 40px;opacity:0;transition:opacity 1.5s;pointer-events:none;background:linear-gradient(to bottom,rgba(5,8,22,.8) 0%,rgba(5,8,22,.3) 60%,transparent 100%)}
#hud.on{opacity:1;pointer-events:auto}
.hc-left{text-align:left}.hc-right{text-align:right}
.hc .cn{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,168,85,.6);font-weight:400}
.hc .ct2{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(24px,3.5vw,38px);font-weight:300;color:#f0e6d2;letter-spacing:.02em;margin-top:2px}
.hc .cd2{font-size:10px;color:rgba(200,168,85,.5);margin-top:4px;letter-spacing:.06em}
.hcc{text-align:center}
.hcc .cl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(200,168,85,.55);font-weight:400}
.hcc .cv{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(18px,2.5vw,26px);color:#c8a855;margin-top:6px;letter-spacing:.04em}

/* ── Moon — top left, below Dublin clock ── */
#moonEl{position:fixed;z-index:13;cursor:pointer;opacity:0;transition:opacity .8s;pointer-events:none;top:100px;left:40px}
#moonEl.on{opacity:1;pointer-events:auto}
#moonEl:hover{filter:brightness(1.3)}

/* ── Side Nav ── */
#sideNav{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:12;display:flex;flex-direction:column;gap:0;opacity:0;transition:opacity 1.5s;pointer-events:none}
#sideNav.on{opacity:1;pointer-events:auto}
.sn{display:flex;align-items:center;gap:12px;cursor:pointer;padding:8px 0;transition:all .4s}
.sn .sd{width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(200,168,85,.35);background:transparent;transition:all .4s;flex-shrink:0}
.sn .sl{font-size:9px;letter-spacing:.14em;color:rgba(200,168,85,.4);font-weight:300;transition:color .4s;text-transform:uppercase;white-space:nowrap}
.sn:hover .sd{border-color:#c8a855;background:rgba(200,168,85,.15);transform:scale(1.4)}
.sn:hover .sl{color:rgba(200,168,85,.7)}
.sn.act .sd{background:#c8a855;border-color:#c8a855;box-shadow:0 0 12px rgba(200,168,85,.4)}
.sn.act .sl{color:#c8a855}

/* ── I Miss You ── */
#missBtn{position:fixed;bottom:40px;right:32px;z-index:12;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(200,168,85,.2);background:rgba(5,8,16,.5);backdrop-filter:blur(12px);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .5s cubic-bezier(.16,1,.3,1);pointer-events:none}
#missBtn.on{opacity:.6;pointer-events:auto}
#missBtn:hover{opacity:1;border-color:rgba(200,168,85,.5);transform:scale(1.08);box-shadow:0 0 24px rgba(200,168,85,.15)}
#missBtn svg{width:20px;height:20px}
#missBtn.puls{animation:hp 1.5s cubic-bezier(.34,1.56,.64,1)}
@keyframes hp{0%{transform:scale(1)}20%{transform:scale(1.25);box-shadow:0 0 40px rgba(200,168,85,.3)}100%{transform:scale(1)}}

#missPulse{position:fixed;inset:0;z-index:11;background:radial-gradient(ellipse at center,rgba(200,168,85,.08) 0%,transparent 70%);opacity:0;pointer-events:none;transition:opacity .6s}
#missPulse.on{opacity:1}
#missToast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s}
#missToast.on{opacity:1}
#missToast .mn{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;color:#c8a855;font-weight:300;letter-spacing:.04em}
#missToast .ms{font-size:10px;color:rgba(240,230,210,.45);letter-spacing:.12em;margin-top:4px}

/* ── Scene Label ── */
#sLab{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:12;opacity:0;transition:opacity 1.5s;pointer-events:none;text-align:center}
#sLab.on{opacity:1}
.sn2{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(14px,2vw,18px);font-weight:300;color:#c8a855;letter-spacing:.06em}
.sh2{font-size:9px;color:rgba(240,230,210,.25);margin-top:4px;letter-spacing:.12em;font-weight:300}

/* ── Audio ── */
#audio{position:fixed;bottom:40px;left:32px;z-index:12;display:flex;gap:8px;opacity:0;transition:opacity 1.5s;pointer-events:none}
#audio.on{opacity:1;pointer-events:auto}
.ab{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(200,168,85,.15);background:rgba(5,8,16,.4);color:rgba(200,168,85,.5);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(8px)}
.ab:hover{border-color:rgba(200,168,85,.4);color:#c8a855;transform:scale(1.1)}
.ab.act{background:rgba(200,168,85,.08);border-color:rgba(200,168,85,.3);color:#c8a855}

/* ── Scroll Hint ── */
#scrlH{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:12;text-align:center;opacity:0;transition:opacity 1s;pointer-events:none}
#scrlH.on{opacity:1}
#scrlH .st{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,168,85,.25);margin-bottom:8px}
#scrlH .sl{width:1px;height:24px;background:linear-gradient(to bottom,rgba(200,168,85,.3),transparent);margin:0 auto;animation:sp 2.5s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:.3;transform:scaleY(1)}50%{opacity:.7;transform:scaleY(1.2)}}

/* ── Toast ── */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:20;background:rgba(5,8,18,.92);backdrop-filter:blur(20px);border:1px solid rgba(200,168,85,.12);border-radius:14px;padding:20px 32px;text-align:center;opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.16,1,.3,1)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .tt{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:#f0e6d2;font-weight:300}

/* ── Scroll Bar ── */
#scrollBar{position:fixed;right:0;top:0;width:2px;height:0;background:linear-gradient(to bottom,rgba(200,168,85,.4),rgba(200,168,85,.15));z-index:12;transition:height .3s;pointer-events:none}

/* ── Gallery ── */
#gallery{position:fixed;inset:0;z-index:22;background:rgba(5,8,16,.97);opacity:0;visibility:hidden;transition:all .8s cubic-bezier(.16,1,.3,1);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(200,168,85,.15) transparent}
#gallery.open{opacity:1;visibility:visible}
.gal-header{position:sticky;top:0;z-index:2;text-align:center;padding:32px 20px 20px;background:linear-gradient(to bottom,rgba(5,8,16,.98),transparent)}
.gal-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,3vw,30px);color:#c8a855;font-weight:300;letter-spacing:.04em}
.gal-sub{font-size:10px;color:rgba(200,168,85,.35);letter-spacing:.15em;margin-top:6px}
.gal-close{position:absolute;top:28px;right:28px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(200,168,85,.15);background:rgba(5,8,16,.5);color:rgba(200,168,85,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .3s}
.gal-close:hover{border-color:rgba(200,168,85,.4);color:#c8a855}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px 36px 60px;max-width:1200px;margin:0 auto}
.gal-card{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;transition:all .4s cubic-bezier(.16,1,.3,1);aspect-ratio:4/3;border:1px solid rgba(200,168,85,.06)}
.gal-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 40px rgba(0,0,0,.4);border-color:rgba(200,168,85,.15)}
.gal-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.gal-card:hover img{transform:scale(1.04)}
.gal-card .gc-info{position:absolute;bottom:0;left:0;right:0;padding:24px 16px 14px;background:linear-gradient(to top,rgba(5,8,16,.85),transparent)}
.gal-card .gc-date{font-size:8px;color:#c8a855;letter-spacing:.15em;text-transform:uppercase}
.gal-card .gc-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;color:#f0e6d2;margin-top:3px;font-weight:300}
.gal-card .gc-desc{font-size:9px;color:rgba(240,230,210,.35);margin-top:2px;font-style:italic}

/* ── Photo Viewer ── */
#photoViewer{position:fixed;inset:0;z-index:25;background:rgba(2,4,12,.96);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:all .6s cubic-bezier(.16,1,.3,1)}
#photoViewer.open{opacity:1;visibility:visible}
#photoViewer img{max-width:88vw;max-height:72vh;object-fit:contain;border-radius:6px;box-shadow:0 12px 50px rgba(0,0,0,.6)}
#photoViewer .pv-date{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;color:#c8a855;letter-spacing:.1em;margin-top:18px;font-weight:300}
#photoViewer .pv-caption{font-size:11px;color:rgba(240,230,210,.4);margin-top:6px;letter-spacing:.06em;font-style:italic}
#photoViewer .pv-close{position:absolute;top:24px;right:28px;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(200,168,85,.15);background:rgba(5,8,16,.5);color:rgba(200,168,85,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .3s}
#photoViewer .pv-close:hover{border-color:rgba(200,168,85,.4);color:#c8a855}
#photoViewer .pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(200,168,85,.15);background:rgba(5,8,16,.4);color:#c8a855;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s}
#photoViewer .pv-nav:hover{border-color:rgba(200,168,85,.4);background:rgba(200,168,85,.06)}
#photoViewer .pv-prev{left:24px}
#photoViewer .pv-next{right:24px}
#photoViewer .pv-count{position:absolute;bottom:24px;font-size:9px;color:rgba(200,168,85,.3);letter-spacing:.12em}

/* ── Moon Overlay ── */
#moonOv{position:fixed;inset:0;z-index:20;background:rgba(5,8,16,.94);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:all .8s cubic-bezier(.16,1,.3,1)}
#moonOv.open{opacity:1;visibility:visible}
#moonOv .mbig{border-radius:50%;box-shadow:0 0 60px rgba(200,200,180,.12);margin-bottom:28px}
#moonOv .mdt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c8a855;margin-bottom:12px}
#moonOv .mmsg{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(17px,2.5vw,26px);font-weight:300;color:#f0e6d2;text-align:center;max-width:480px;line-height:1.6;font-style:italic;padding:0 20px}
#moonOv .mcl{margin-top:36px;padding:8px 22px;border:1.5px solid rgba(200,168,85,.2);border-radius:18px;background:transparent;color:#c8a855;font-size:10px;letter-spacing:.12em;cursor:pointer;transition:all .3s}
#moonOv .mcl:hover{border-color:rgba(200,168,85,.4);background:rgba(200,168,85,.05)}

/* ── Letter System ── */
#letOv{position:fixed;inset:0;z-index:20;background:rgba(5,8,16,.94);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .8s cubic-bezier(.16,1,.3,1)}
#letOv.open{opacity:1;visibility:visible}
.letEnv{width:min(600px,92vw);max-height:80vh;background:linear-gradient(145deg,rgba(16,18,30,.96),rgba(10,12,24,.98));border:1px solid rgba(200,168,85,.1);border-radius:16px;transform:translateY(24px) scale(.97);transition:transform .8s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;display:flex;flex-direction:column}
#letOv.open .letEnv{transform:translateY(0) scale(1)}
.letX{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(200,168,85,.1);background:rgba(5,8,16,.4);color:rgba(200,168,85,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:2;transition:all .3s}
.letX:hover{border-color:rgba(200,168,85,.3);color:#c8a855}
.letTabs{display:flex;border-bottom:1px solid rgba(200,168,85,.08);padding:0 24px}
.letTab{padding:14px 20px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,168,85,.4);cursor:pointer;border-bottom:1.5px solid transparent;transition:all .3s;font-weight:300}
.letTab:hover{color:rgba(200,168,85,.65)}
.letTab.active{color:#c8a855;border-bottom-color:#c8a855}
.letTab .badge{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c8a855;margin-left:6px;opacity:0;transition:opacity .3s}
.letTab .badge.on{opacity:.8}
.letPanels{flex:1;overflow-y:auto;padding:20px 24px;scrollbar-width:thin;scrollbar-color:rgba(200,168,85,.1) transparent}
.letPanel{display:none}.letPanel.active{display:block}
.letItem{padding:16px;border:1px solid rgba(200,168,85,.06);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .3s;position:relative}
.letItem:hover{border-color:rgba(200,168,85,.18);background:rgba(200,168,85,.02)}
.letItem.unread{border-left:2.5px solid #c8a855}
.letItem .li-from{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:#f0e6d2;font-weight:300}
.letItem .li-preview{font-size:11px;color:rgba(240,230,210,.4);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.letItem .li-date{font-size:9px;color:rgba(200,168,85,.3);margin-top:6px;letter-spacing:.08em}
.letItem .li-dot{position:absolute;top:20px;right:14px;width:7px;height:7px;border-radius:50%;background:#c8a855;opacity:0;transition:opacity .3s}
.letItem.unread .li-dot{opacity:.7}
.letRead{display:none;padding:28px}.letRead.active{display:block}
.letRead .lr-back{font-size:10px;color:rgba(200,168,85,.4);cursor:pointer;letter-spacing:.08em;margin-bottom:18px;display:inline-block;transition:color .3s}
.letRead .lr-back:hover{color:#c8a855}
.letRead .lr-from{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:#c8a855;font-weight:300}
.letRead .lr-date{font-size:9px;color:rgba(200,168,85,.3);letter-spacing:.1em;margin-top:4px}
.letRead .lr-body{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;color:#f0e6d2;line-height:1.9;margin-top:22px;font-weight:300;white-space:pre-wrap}
.letRead .lr-sig{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;color:#c8a855;margin-top:28px;font-style:italic;text-align:right}
.letWrite{display:none;padding:24px}.letWrite.active{display:block}
.letWrite h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:300;color:#c8a855;margin-bottom:16px}
.letWrite textarea{width:100%;min-height:150px;border:none;background:transparent;color:#f0e6d2;font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;line-height:1.8;resize:none;outline:none}
.letWrite textarea::placeholder{color:rgba(240,230,210,.15);font-style:italic}
.letWrite .letAct{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(200,168,85,.06)}
.letWrite .letCnt{font-size:10px;color:rgba(200,168,85,.3);letter-spacing:.06em}
.letSend{padding:8px 20px;border:1.5px solid rgba(200,168,85,.2);border-radius:20px;background:rgba(200,168,85,.04);color:#c8a855;font-size:10px;cursor:pointer;transition:all .3s;letter-spacing:.06em}
.letSend:hover{background:rgba(200,168,85,.1);border-color:rgba(200,168,85,.35)}
.letEmpty{text-align:center;padding:40px 20px;color:rgba(200,168,85,.25);font-size:12px;letter-spacing:.08em;font-style:italic;font-family:'Cormorant Garamond',Georgia,serif}

/* ── Paper Airplane ── */
.pp{position:fixed;z-index:18;pointer-events:none;opacity:0;transition:none}
.pp svg{filter:drop-shadow(0 0 8px rgba(200,168,85,.4))}
.pp.incoming svg{stroke:#88b4d8;filter:drop-shadow(0 0 8px rgba(136,180,216,.4))}

/* ── Firefly ── */
.ff{position:fixed;z-index:15;width:7px;height:7px;border-radius:50%;background:#c8a855;box-shadow:0 0 12px rgba(200,168,85,.5),0 0 24px rgba(200,168,85,.2);pointer-events:auto;cursor:pointer;transition:box-shadow .3s}
.ff:hover{box-shadow:0 0 24px rgba(200,168,85,.7),0 0 48px rgba(200,168,85,.3)}
.ff.open{animation:fLand .7s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fLand{0%{transform:scale(1)}50%{transform:scale(1.8);box-shadow:0 0 40px rgba(200,168,85,.6)}100%{transform:scale(0);opacity:0}}

/* ── Time Overlay ── */
#timeOv{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 3s}

@media(max-width:768px){
  #hud{padding:16px 18px;grid-template-columns:1fr 1fr}
  .hcc{display:none}
  #sideNav{right:10px}.sn .sl{display:none}
  #missBtn{bottom:20px;right:16px;width:42px;height:42px}
  #audio{bottom:20px;left:16px}
  .gal-grid{padding:16px 18px 40px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  #moonEl{left:18px;top:80px}
}
</style>
</head>
<body>

<canvas id="skyCanvas"></canvas>
<canvas id="mainCanvas"></canvas>

<!-- Landing -->
<div id="landing">
  <canvas id="landCanvas"></canvas>
  <div id="titleBlock"><h1><em>Parallel</em> Hearts</h1><div class="tagline">Different skies. Same heartbeat.</div></div>
  <button id="enterBtn">Enter Our World</button>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hc hc-left"><div class="cn">Dublin</div><div class="ct2" id="clDub">--:--</div><div class="cd2" id="weDub"></div></div>
  <div class="hcc"><div class="cl">Until we meet</div><div class="cv" id="cdVal"></div></div>
  <div class="hc hc-right"><div class="cn">Bangalore</div><div class="ct2" id="clBan">--:--</div><div class="cd2" id="weBan"></div></div>
</div>

<!-- Constellation Nav -->
<div id="sideNav">
  <div class="sn act" data-s="home"><div class="sd"></div><div class="sl">Home</div></div>
  <div class="sn" data-s="gallery"><div class="sd"></div><div class="sl">Gallery</div></div>

<script>
const $=id=>document.getElementById(id);
const PI=Math.PI,TAU=PI*2;
let W=innerWidth,H=innerHeight;
let phase='landing',scrollP=0,time=0;
addEventListener('resize',()=>{W=innerWidth;H=innerHeight});

/* ═══════════════════════════════════════════
   LANDING — Stars Being Born
   ═══════════════════════════════════════════ */
const lCanvas=$('landCanvas'),lCtx=lCanvas.getContext('2d');
function resizeLanding(){lCanvas.width=W;lCanvas.height=H}
resizeLanding();addEventListener('resize',resizeLanding);

const bgStars=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,bright:Math.random()*.5+.15,flicker:Math.random()*TAU}));
const constStars=[
  {x:.18,y:.28,r:1.8,bright:.6},{x:.14,y:.22,r:1.4,bright:.5},{x:.22,y:.2,r:1.3,bright:.48},
  {x:.12,y:.35,r:1.5,bright:.52},{x:.2,y:.38,r:1.2,bright:.45},{x:.16,y:.42,r:1.6,bright:.55},
  {x:.78,y:.3,r:1.8,bright:.6},{x:.82,y:.22,r:1.4,bright:.5},{x:.74,y:.25,r:1.3,bright:.48},
  {x:.84,y:.35,r:1.5,bright:.52},{x:.76,y:.4,r:1.2,bright:.45},{x:.8,y:.44,r:1.6,bright:.55},
  {x:.35,y:.15,r:1.1,bright:.38},{x:.65,y:.12,r:1.2,bright:.4},{x:.5,y:.72,r:1,bright:.35},
  {x:.42,y:.68,r:1.1,bright:.37},{x:.58,y:.75,r:1,bright:.34},{x:.3,y:.6,r:.9,bright:.3},
];
const constLines=[[0,1],[1,2],[0,3],[3,4],[4,5],[6,7],[7,8],[6,9],[9,10],[10,11],[12,13],[14,15],[16,17]];
const heartStars=[{x:.38,y:.48,r:3.5,bright:0,target:1},{x:.62,y:.48,r:3.5,bright:0,target:1}];
let threadProg=0,threadTarget=0,zoom=1,zoomTarget=1;
let landPhase=0,landStart=performance.now();
const pTime=[800,2800,5000,7000,8500,10500,13000];

function drawLanding(ts){
  if(phase!=='landing')return;
  const el=ts-landStart;
  let np=0;for(let i=pTime.length-1;i>=0;i--){if(el>pTime[i]){np=i+1;break}}
  if(np!==landPhase){
    landPhase=np;
    if(landPhase===3){heartStars[0].target=1;heartStars[1].target=1}
    if(landPhase===4)threadTarget=1;
    if(landPhase===5)zoomTarget=.65;
    if(landPhase===6){$('titleBlock').style.opacity='1';setTimeout(()=>{$('enterBtn').style.opacity='1';$('enterBtn').classList.add('show')},1500)}
  }
  lCtx.fillStyle='#050816';lCtx.fillRect(0,0,W,H);
  lCtx.save();zoom+=(zoomTarget-zoom)*.008;lCtx.translate(W/2,H/2);lCtx.scale(zoom,zoom);lCtx.translate(-W/2,-H/2);
  const bgC=Math.min(bgStars.length,Math.floor(el/50));
  bgStars.slice(0,bgC).forEach(s=>{const f=.7+Math.sin(ts*.002+s.flicker)*.3;lCtx.fillStyle=`rgba(240,230,210,${s.bright*f})`;lCtx.beginPath();lCtx.arc(s.x*W,s.y*H,s.r,0,TAU);lCtx.fill()});
  if(landPhase>=1){const cC=Math.min(constStars.length,Math.floor((el-pTime[1])/70));constStars.slice(0,cC).forEach(s=>{const f=.7+Math.sin(ts*.002+s.bright*10)*.3;lCtx.fillStyle=`rgba(240,230,210,${s.bright*f})`;lCtx.beginPath();lCtx.arc(s.x*W,s.y*H,s.r,0,TAU);lCtx.fill()})}
  if(landPhase>=2){const lP=Math.min(1,(el-pTime[2])/2000);lCtx.strokeStyle=`rgba(200,168,85,${.12*lP})`;lCtx.lineWidth=.6;constLines.forEach((line,i)=>{if(i/constLines.length>lP)return;const a=constStars[line[0]],b=constStars[line[1]];if(!a||!b)return;lCtx.beginPath();lCtx.moveTo(a.x*W,a.y*H);lCtx.lineTo(b.x*W,b.y*H);lCtx.stroke()})}
  heartStars.forEach(h=>{h.bright+=(h.target-h.bright)*.018;if(h.bright<.01)return;const p=.8+Math.sin(ts*.0015)*.2;const g=lCtx.createRadialGradient(h.x*W,h.y*H,0,h.x*W,h.y*H,h.r*10);g.addColorStop(0,`rgba(200,168,85,${h.bright*.3*p})`);g.addColorStop(1,'rgba(200,168,85,0)');lCtx.fillStyle=g;lCtx.beginPath();lCtx.arc(h.x*W,h.y*H,h.r*10,0,TAU);lCtx.fill();lCtx.fillStyle=`rgba(255,215,100,${h.bright*p})`;lCtx.beginPath();lCtx.arc(h.x*W,h.y*H,h.r,0,TAU);lCtx.fill();lCtx.fillStyle=`rgba(255,255,240,${h.bright*p*.8})`;lCtx.beginPath();lCtx.arc(h.x*W,h.y*H,h.r*.35,0,TAU);lCtx.fill()});
  threadProg+=(threadTarget-threadProg)*.015;
  if(threadProg>.01){const sx=heartStars[0].x*W,sy=heartStars[0].y*H,ex=heartStars[1].x*W,ey=heartStars[1].y*H,mx=(sx+ex)/2,my=Math.min(sy,ey)-70;lCtx.strokeStyle=`rgba(200,168,85,${threadProg*.4})`;lCtx.lineWidth=1.5;lCtx.shadowBlur=10;lCtx.shadowColor='rgba(200,168,85,.3)';lCtx.beginPath();lCtx.moveTo(sx,sy);lCtx.quadraticCurveTo(mx,my,sx+(ex-sx)*threadProg,sy+(ey-sy)*threadProg);lCtx.stroke();lCtx.shadowBlur=0;if(threadProg>.1){const tp=(ts*.0003)%1,px=sx+(ex-sx)*tp,py=sy+(ey-sy)*tp-(1-tp)*tp*140;lCtx.fillStyle=`rgba(200,168,85,${threadProg*.6})`;lCtx.beginPath();lCtx.arc(px,py,2.5,0,TAU);lCtx.fill()}}
  if(landPhase>=3){const la=Math.min(1,(el-pTime[3])/1500);lCtx.font='300 15px "Cormorant Garamond"';lCtx.textAlign='center';lCtx.fillStyle=`rgba(200,168,85,${la*.7})`;lCtx.fillText('Rashmi \u2726',heartStars[0].x*W,heartStars[0].y*H+32);lCtx.fillText('Sharath \u2726',heartStars[1].x*W,heartStars[1].y*H+32)}
  lCtx.restore();requestAnimationFrame(drawLanding);
}
requestAnimationFrame(drawLanding);

/* ═══════════════════════════════════════════
   ENTER
   ═══════════════════════════════════════════ */
$('enterBtn').addEventListener('click',()=>{
  if(phase!=='landing')return;phase='trans';$('landing').classList.add('out');
  setTimeout(()=>{$('landing').style.display='none';phase='universe';$('mainCanvas').classList.add('on');$('hud').classList.add('on');$('sideNav').classList.add('on');$('missBtn').classList.add('on');$('audio').classList.add('on');$('moonEl').classList.add('on');$('scrlH').classList.add('on');lab('Your Universe','Scroll to travel through time');setTimeout(()=>$('scrlH').classList.remove('on'),8000);updateAll()},2500);
});

/* ═══════════════════════════════════════════
   ASTRONOMICAL
   ═══════════════════════════════════════════ */
function toJD(date){const y=date.getUTCFullYear(),m=date.getUTCMonth()+1,d=date.getUTCDate()+date.getUTCHours()/24+date.getUTCMinutes()/1440;let Y=y,M=m;if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5}
function sunPos(date,lat,lng){const jd=toJD(date),T=(jd-2451545)/36525;const L0=(280.46646+T*(36000.76983+T*.0003032))%360;const M=(357.52911+T*(35999.05029-.0001537*T))%360;const Mr=M*PI/180;const C=(1.9146-.004817*T-.000014*T*T)*Math.sin(Mr)+(0.019993-.000101*T)*Math.sin(2*Mr)+.00029*Math.sin(3*Mr);const sunLon=(L0+C)*PI/180;const obliquity=(23.439-0.00000036*T)*PI/180;const decl=Math.asin(Math.sin(obliquity)*Math.sin(sunLon));const RA=Math.atan2(Math.cos(obliquity)*Math.sin(sunLon),Math.cos(sunLon));const djd=(jd-2451545);const GMST=(6.697375+.06570982441908*djd+1.00273790935+.000026*(T*T))*15*PI/180;let HA=GMST+lng*PI/180-RA;while(HA>PI)HA-=TAU;while(HA<-PI)HA+=TAU;const latR=lat*PI/180;const alt=Math.asin(Math.sin(latR)*Math.sin(decl)+Math.cos(latR)*Math.cos(decl)*Math.cos(HA));const az=Math.atan2(-Math.sin(HA),Math.tan(decl)*Math.cos(latR)-Math.sin(latR)*Math.cos(HA));return{altitude:alt*180/PI,azimuth:((az*180/PI)+360)%360,declination:decl*180/PI}}
function moonPhase(date){const jd=toJD(date),T=(jd-2451545)/36525;const L0=218.3165+T*481267.8813;const M=134.9634+T*477198.8676;const Mp=350.7374+T*445267.1115;const F=93.2720+T*483202.0175;const l=(L0+6.289*Math.sin(M*PI/180)+1.274*Math.sin((2*Mp-M)*PI/180)+.658*Math.sin(2*Mp*PI/180))%360;const age=(l-M)%360;const illum=(1+Math.cos(age*PI/180))/2;const phaseName=illum>.97?'Full Moon':illum>.5?'Waxing':illum>.03?'Waxing Crescent':'New Moon';return{illumination:Math.max(0,Math.min(1,illum)),age:((age%360)+360)%360/360*29.53,name:phaseName}}

const stars=[{name:'Sirius',ra:101.29,dec:-16.72,mag:-1.46},{name:'Canopus',ra:95.99,dec:-52.70,mag:-0.74},{name:'Arcturus',ra:213.92,dec:19.18,mag:-0.05},{name:'Vega',ra:279.23,dec:38.78,mag:0.03},{name:'Capella',ra:79.17,dec:46.00,mag:0.08},{name:'Rigel',ra:78.63,dec:-8.20,mag:0.13},{name:'Procyon',ra:114.83,dec:5.23,mag:0.34},{name:'Betelgeuse',ra:88.79,dec:7.41,mag:0.42},{name:'Altair',ra:297.70,dec:8.87,mag:0.76},{name:'Aldebaran',ra:68.98,dec:16.51,mag:0.87},{name:'Antares',ra:247.35,dec:-26.43,mag:1.09},{name:'Spica',ra:201.30,dec:-11.16,mag:1.04},{name:'Pollux',ra:116.33,dec:28.03,mag:1.14},{name:'Deneb',ra:310.36,dec:45.28,mag:1.25},{name:'Regulus',ra:152.09,dec:11.97,mag:1.40},{name:'Castor',ra:113.65,dec:31.89,mag:1.58},{name:'Shaula',ra:263.40,dec:-37.10,mag:1.63},{name:'Bellatrix',ra:81.28,dec:6.35,mag:1.64},{name:'Elnath',ra:81.57,dec:28.61,mag:1.65},{name:'Alioth',ra:193.51,dec:55.96,mag:1.77},{name:'Dubhe',ra:165.93,dec:61.75,mag:1.79},{name:'Mirfak',ra:51.08,dec:49.86,mag:1.80},{name:'Alkaid',ra:206.89,dec:49.31,mag:1.86},{name:'Mizar',ra:200.98,dec:54.93,mag:2.27},{name:'Saiph',ra:86.94,dec:-9.67,mag:2.06}];
const bgStars2=[];for(let i=0;i<300;i++){bgStars2.push({ra:Math.random()*360,dec:(Math.random()-.5)*160,mag:2.5+Math.random()*2.5,flicker:Math.random()*TAU})}

function drawSky(ctx,date,lat,lng,offsetX){
  const sun=sunPos(date,lat,lng);
  const grad=ctx.createLinearGradient(offsetX,0,offsetX,H);
  if(sun.altitude>5){grad.addColorStop(0,'#1a2a4a');grad.addColorStop(.3,'#2a4060');grad.addColorStop(.6,'#4a6888');grad.addColorStop(1,'#6a8aa8')}
  else if(sun.altitude>-2){grad.addColorStop(0,'#0a0c18');grad.addColorStop(.2,'#1a1420');grad.addColorStop(.5,'#3a2018');grad.addColorStop(.8,'#6a3820');grad.addColorStop(1,'#8a5030')}
  else if(sun.altitude>-8){grad.addColorStop(0,'#060810');grad.addColorStop(.3,'#100e18');grad.addColorStop(.6,'#201820');grad.addColorStop(1,'#302028')}
  else{grad.addColorStop(0,'#020408');grad.addColorStop(.3,'#050810');grad.addColorStop(.6,'#080c18');grad.addColorStop(1,'#0a1020')}
  ctx.fillStyle=grad;ctx.fillRect(offsetX,0,W,H);
  if(sun.altitude<0){
    const sb=Math.min(1,Math.abs(sun.altitude)/8);
    bgStars2.forEach(s=>{const sa=s.dec*PI/180;const ha=(s.ra*PI/180-(date.getUTCHours()+date.getUTCMinutes()/60)*15*PI/180+lng*PI/180);const x=offsetX+W/2+(ha%(TAU)-PI)*W/TAU*.5;const y=H/2-sa*H/PI;if(x<offsetX-10||x>offsetX+W+10)return;const fl=.5+.5*Math.sin(time*2+s.flicker);const a=sb*(1-s.mag/5)*fl;if(a<=0)return;ctx.fillStyle=`rgba(240,230,210,${a})`;ctx.beginPath();ctx.arc(x,y,.8+s.mag*.3,0,TAU);ctx.fill()});
    stars.forEach(s=>{const sa=s.dec*PI/180;const ha=(s.ra*PI/180-(date.getUTCHours()+date.getUTCMinutes()/60)*15*PI/180+lng*PI/180);const x=offsetX+W/2+(ha%(TAU)-PI)*W/TAU*.5;const y=H/2-sa*H/PI;if(x<offsetX-10||x>offsetX+W+10)return;const fl=.7+.3*Math.sin(time*1.5+s.flicker);const a=sb*Math.max(0,1-s.mag/4)*fl;if(a<=0)return;ctx.fillStyle=`rgba(240,230,210,${a})`;ctx.beginPath();ctx.arc(x,y,1.2,0,TAU);ctx.fill();if(a>.3&&s.mag<1.5){ctx.fillStyle=`rgba(200,168,85,${a*.3})`;ctx.font='300 7px Inter';ctx.textAlign='center';ctx.fillText(s.name,x,y-6)}})
  }
}

const DUBLIN={lat:53.3498,lng:-6.2603},BANGALORE={lat:12.9716,lng:77.5946};
const mainCanvas=$('mainCanvas'),mainCtx=mainCanvas.getContext('2d');
const skyCanvas=$('skyCanvas'),skyCtx=skyCanvas.getContext('2d');
function resize(){mainCanvas.width=W;mainCanvas.height=H;skyCanvas.width=W;skyCanvas.height=H}
resize();addEventListener('resize',resize);

function updateAll(){
  if(phase!=='universe')return;
  const now=new Date();
  const baseHour=scrollP*24;
  const hour=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(baseHour),Math.floor((baseHour%1)*60));
  skyCtx.clearRect(0,0,W,H);drawSky(skyCtx,hour,DUBLIN.lat,DUBLIN.lng,0);
  mainCtx.clearRect(0,0,W,H);drawSky(mainCtx,hour,BANGALORE.lat,BANGALORE.lng,W/2);
  mainCtx.strokeStyle='rgba(200,168,85,.08)';mainCtx.lineWidth=1;mainCtx.beginPath();mainCtx.moveTo(W/2,0);mainCtx.lineTo(W/2,H);mainCtx.stroke();
  mainCtx.font='300 9px Inter';mainCtx.fillStyle='rgba(200,168,85,.25)';mainCtx.textAlign='center';
  mainCtx.fillText('DUBLIN',W/4,H-40);mainCtx.fillText('BANGALORE',W*3/4,H-40);
  updateClocks();updateMoon();updateWeather();tickFireflies();
}

/* ═══════════════════════════════════════════
   MOON
   ═══════════════════════════════════════════ */
function updateMoon(){
  const now=new Date(),moon=moonPhase(now),sun=sunPos(now,DUBLIN.lat,DUBLIN.lng),visible=sun.altitude<-6;
  const el=$('moonEl'),sz=visible?32:26;
  el.style.width=sz+'px';el.style.height=sz+'px';el.style.borderRadius='50%';
  el.style.background=`radial-gradient(circle at ${40-moon.illumination*30}% 35%, #eee ${moon.illumination*60}%, #aaa ${40+moon.illumination*30}%, #666 100%)`;
  el.style.boxShadow=`0 0 ${visible?24:10}px rgba(200,200,180,${visible?.15:.05})`;
  el.onclick=()=>{
    const canvas=$('moonBig'),ctx=canvas.getContext('2d');canvas.width=120;canvas.height=120;
    ctx.beginPath();ctx.arc(60,60,50,0,TAU);const grd=ctx.createRadialGradient(60,60,0,60,60,50);grd.addColorStop(0,'#eee');grd.addColorStop(.7,'#ccc');grd.addColorStop(1,'#999');ctx.fillStyle=grd;ctx.fill();
    ctx.beginPath();ctx.arc(60,60,50,0,TAU);ctx.fillStyle=`rgba(5,8,16,${1-moon.illumination})`;ctx.fill();
    const msgs=['Tonight, the same moon hangs over Dublin and Bangalore. She looks up. He looks up. Same light. Two cities. One heart.','The moon doesn\'t care about borders or time zones. It just shines. The way your love does.','Some nights, the moon is all you have in common with someone far away. And somehow, that\'s enough.','He can\'t hold your hand tonight. But the moonlight falling on your skin is the same light touching his.'];
    $('mDt').textContent=`${moon.name} \u2014 ${Math.round(moon.illumination*100)}% illuminated`;
    $('mMs').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    $('moonOv').classList.add('open');
  };
}

/* ═══════════════════════════════════════════
   PAPER AIRPLANE LETTERS
   ═══════════════════════════════════════════ */
function flyPlane(direction,color,delay){
  return new Promise(resolve=>{
    setTimeout(()=>{
      const plane=document.createElement('div');
      plane.className='pp'+(direction==='incoming'?' incoming':'');
      plane.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.2"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>';
      document.body.appendChild(plane);
      let sx,sy,ex,ey;
      if(direction==='outgoing'){sx=W*.55;sy=H*.45;ex=-40;ey=H*.1}
      else{sx=-40;sy=H*.1;ex=W*.55;ey=H*.45}
      const st=performance.now();
      (function anim(now){
        const p=Math.min(1,(now-st)/2800);
        const e=1-Math.pow(1-p,3);
        const curX=sx+(ex-sx)*e;
        const curY=sy+(ey-sy)*e-Math.sin(p*PI)*100;
        const angle=direction==='outgoing'?-45+p*320:135-p*320;
        plane.style.left=curX+'px';plane.style.top=curY+'px';
        plane.style.transform='rotate('+angle+'deg) scale('+(1-p*.5)+')';
        plane.style.opacity=String(1-p*.7);
        plane.style.display='block';
        /* Trail particles */
        if(p<.9&&Math.random()>.6){
          const trail=document.createElement('div');
          trail.style.cssText='position:fixed;width:3px;height:3px;border-radius:50%;background:'+color+';opacity:.4;z-index:17;pointer-events:none;left:'+(curX+14)+'px;top:'+(curY+14)+'px;transition:all .8s ease-out';
          document.body.appendChild(trail);
          setTimeout(()=>{trail.style.opacity='0';trail.style.transform='scale(0)';setTimeout(()=>trail.remove(),800)},50);
        }
        if(p<1)requestAnimationFrame(anim);
        else{plane.remove();resolve()}
      })(performance.now());
    },delay);
  });
}

const ffs=[];
function spawnFF(msg){
  const el=document.createElement('div');el.className='ff';el.title='A thought from Sharath';
  const sx=Math.random()*W*.6+W*.2,sy=H+10;el.style.left=sx+'px';el.style.top=sy+'px';
  document.body.appendChild(el);
  const d={el,x:sx,y:sy,vx:(Math.random()-.5)*1.5,vy:-.8-Math.random()*1.5,ph:Math.random()*TAU,msg};
  ffs.push(d);
  el.addEventListener('click',()=>{el.classList.add('open');setTimeout(()=>{el.remove();ffs.splice(ffs.indexOf(d),1);toast(msg)},700)});
}
function tickFireflies(){ffs.forEach(f=>{f.ph+=.015;f.x+=Math.sin(f.ph)*1.2+f.vx;f.y+=Math.cos(f.ph*.6)*.6+f.vy;if(f.y<-10){f.y=H+10;f.x=Math.random()*W*.6+W*.2}f.el.style.left=f.x+'px';f.el.style.top=f.y+'px';f.el.style.opacity=.5+.4*Math.sin(f.ph*2.5)})}

const LETTERS_KEY='parallel_hearts_letters';
const defaultLetters=[
  {id:'s1',from:'Sharath',to:'Rashmi',date:'2026-01-05',body:'I know you just left yesterday. The house feels different already. I walked into the kitchen this morning and your coffee mug was still on the counter. I didn\'t move it.\n\nI keep telling myself this is temporary. December will come. You\'ll come home. But right now, sitting in this quiet apartment, temporary feels like forever.\n\nI miss the way you hum when you cook. I miss hearing your keys in the door. I miss knowing you were just in the next room.\n\nBe safe in Dublin. Study hard. And know that every night, I look up at the same moon you do.\n\nI love you.',read:false},
  {id:'s2',from:'Sharath',to:'Rashmi',date:'2026-01-15',body:'Two weeks. It\'s been two weeks and I still reach for my phone to call you at 6pm before remembering you\'re 5:30 hours behind.\n\nI went to our biryani place today. The one near Brigade Road. The owner asked where you were. I said Ireland. He looked confused. I think he thought I was joking.\n\nSometimes I sit in the car after work and just... stay there. Because the apartment is too quiet without you.\n\nBut I\'m proud of you. What you\'re doing takes courage. Most people wouldn\'t leave everything they know to chase something bigger.\n\nYou\'re not most people.\n\nCome home to me in December.',read:false},
  {id:'s3',from:'Sharath',to:'Rashmi',date:'2026-02-03',body:'Happy birthday to me, I guess. You called at midnight your time. I pretended to be asleep but I was smiling so hard my face hurt.\n\nThank you for the video message. I watched it four times. The way you said "I wish I was there" \u2014 I could hear it in your voice. I feel the same way every single day.\n\nYour birthday is next month. I\'ll be counting the days.\n\nI love you more than biryani. And you know how much I love biryani.\n\nAlways,\nSharath',read:false},
  {id:'s4',from:'Sharath',to:'Rashmi',date:'2026-03-20',body:'Happy birthday, my love.\n\nI know it\'s hard being away on your birthday. I know you wanted to celebrate together. I know this isn\'t what we planned.\n\nBut here\'s what I know for sure: one day we\'ll look back at this year and realize it was the thing that made us unbreakable.\n\nEat some cake for me. Light a candle. Make a wish.\n\nI already know what I\'m wishing for.\n\nDecember. You. Home.\n\nForever yours,\nSharath',read:false},
  {id:'s5',from:'Sharath',to:'Rashmi',date:'2026-04-12',body:'I had a dream about you last night. We were at the beach in Goa, the one we went to before the wedding. You were laughing at something I said. I don\'t remember what, but I remember the sound.\n\nI woke up and for a second I thought you were in the next room. Then I remembered.\n\n8,580 km. That\'s what the internet says. But it doesn\'t feel like a number. It feels like every quiet evening, every meal alone, every time I reach for you and you\'re not there.\n\nBut then I see your messages. Your photos. The way you\'re building something in Dublin. And I think \u2014 she\'s coming back. She\'s coming back to me.\n\nThat\'s enough to keep going.\n\nMiss you always.',read:false},
  {id:'s6',from:'Sharath',to:'Rashmi',date:'2026-05-23',body:'One year.\n\nOne year ago today, you walked toward me in that white dress and I forgot every word I\'d prepared. I just stood there, watching you, thinking \u2014 how did I get this lucky?\n\nI\'m sorry I can\'t be there today. I\'m sorry we can\'t celebrate together. But I want you to know: marrying you was the best decision I ever made. Even the distance can\'t change that.\n\nEspecially the distance.\n\nIt taught me that love isn\'t about proximity. It\'s about choosing someone, every day, even when they\'re 8,580 km away.\n\nHappy anniversary, Rashmi. I\'ll be looking at our wedding photos tonight.\n\nAlways yours,\nSharath',read:false},
  {id:'s7',from:'Sharath',to:'Rashmi',date:'2026-06-10',body:'Something small happened today that I wanted to tell you about.\n\nI was walking home from work and I passed a couple holding hands. They were laughing about something. And for the first time, it didn\'t hurt to see that. It just made me think of you.\n\nI thought about the way you hold my hand \u2014 how you always interlock your fingers first. I thought about how you squeeze twice when you want me to know you\'re there.\n\nI can\'t hold your hand right now. But I can remember how it feels. And I can wait for the day I get to hold it again.\n\nSix more months. I\'m counting.\n\nLove,\nSharath',read:false},
];
function loadLetters(){const s=localStorage.getItem(LETTERS_KEY);if(s){try{return JSON.parse(s)}catch(e){}}localStorage.setItem(LETTERS_KEY,JSON.stringify(defaultLetters));return[...defaultLetters]}

function renderInbox(){const panel=$('inboxPanel');const sl=letters.filter(l=>l.from==='Sharath').sort((a,b)=>new Date(b.date)-new Date(a.date));if(!sl.length){panel.innerHTML='<div class="letEmpty">No letters yet. He\'ll write soon.</div>';return}panel.innerHTML=sl.map(l=>'<div class="letItem '+(l.read?'':'unread')+'" onclick="openLetter(\''+l.id+'\')"><div class="li-from">'+l.from+'</div><div class="li-preview">'+l.body.substring(0,120)+'...</div><div class="li-date">'+formatDate(l.date)+'</div><div class="li-dot"></div></div>').join('')}

function openLetter(id){const l=letters.find(x=>x.id===id);if(!l)return;if(!l.read){l.read=true;saveLetters();updateBadge()}$('lrFrom').textContent=l.from==='Sharath'?l.from+' \u2726':'To: '+l.to;$('lrDate').textContent=formatDate(l.date);$('lrBody').textContent=l.body;$('lrSig').textContent=l.from==='Sharath'?'\u2014 '+l.from:'With love, Rashmi';document.querySelectorAll('.letPanel,.letWrite').forEach(p=>p.classList.remove('active'));$('readPanel').classList.add('active')}

async function sendPlane(){
  const text=$('letTx').value.trim();if(!text)return;
  if(text.split(/\s+/).filter(Boolean).length>250){toast('Keep it under 250 words');return}
  letters.push({id:'r'+Date.now(),from:'Rashmi',to:'Sharath',date:new Date().toISOString().split('T')[0],body:text,read:true});
  saveLetters();$('letTx').value='';$('letCnt').textContent='0 words';renderOutbox();
  $('letOv').classList.remove('open');
  await flyPlane('outgoing','#c8a855',200);
  toast('Letter sent across the stars \u2726');
  /* Simulate a reply after 8 seconds */
  setTimeout(()=>{spawnFF('A letter from Sharath is on its way...');setTimeout(()=>{flyPlane('incoming','#88b4d8',0).then(()=>{toast('Sharath wrote back \u2726')})},3000)},8000);
}

/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════ */
let actx=null;const asnd={};
function iA(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}
function mkPiano(){if(asnd.piano)return sS('piano');iA();const o1=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();o1.type='sine';o1.frequency.value=220;o2.type='sine';o2.frequency.value=330;f.type='lowpass';f.frequency.value=400;g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(actx.destination);o1.start();o2.start();g.gain.linearRampToValueAtTime(.025,actx.currentTime+2);asnd.piano={osc:[o1,o2],gain:g};document.querySelector('[data-s="piano"]').classList.add('act')}
function mkRain(){if(asnd.rain)return sS('rain');iA();const buf=actx.createBuffer(1,2*actx.sampleRate,actx.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;d[i]=(last+.02*w)/1.02;last=d[i];d[i]*=3.5}const n=actx.createBufferSource();n.buffer=buf;n.loop=true;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=.5;const g=actx.createGain();g.gain.value=0;n.connect(f);f.connect(g);g.connect(actx.destination);n.start();g.gain.linearRampToValueAtTime(.035,actx.currentTime+2);asnd.rain={noise:n,gain:g};document.querySelector('[data-s="rain"]').classList.add('act')}
function mkNight(){if(asnd.night)return sS('night');iA();const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=440;o2.type='triangle';o2.frequency.value=554;g.gain.value=0;o.connect(g);o2.connect(g);g.connect(actx.destination);o.start();o2.start();g.gain.linearRampToValueAtTime(.012,actx.currentTime+3);asnd.night={osc:[o,o2],gain:g};document.querySelector('[data-s="night"]').classList.add('act')}
function sS(t){const s=asnd[t];if(!s)return;if(s.gain)s.gain.gain.linearRampToValueAtTime(0,actx.currentTime+1);setTimeout(()=>{if(s.osc)(Array.isArray(s.osc)?s.osc:[s.osc]).forEach(o=>{try{o.stop()}catch(e){}});if(s.noise)try{s.noise.stop()}catch(e){}},1100);delete asnd[t];document.querySelector('[data-s="'+t+'"]')?.classList.remove('act')}
document.querySelectorAll('.ab').forEach(b=>b.addEventListener('click',()=>{const s=b.dataset.s;if(s==='piano')mkPiano();if(s==='rain')mkRain();if(s==='night')mkNight()}));
